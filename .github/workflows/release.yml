# Builds Heavy Gear II port packages for macOS (universal .app), Linux and Windows on every push,
# and attaches them to a GitHub release when a v* tag is pushed. No game data is included.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos-universal
            extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - os: ubuntu-24.04
            name: linux-x86_64
            extra: ""
          - os: windows-2022
            name: windows-x64
            extra: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols libpulse-dev libasound2-dev \
            libudev-dev libdbus-1-dev libgl1-mesa-dev
      - name: Configure
        shell: bash
        run: cmake -S . -B out -DCMAKE_BUILD_TYPE=Release -DHG2_FETCH_DEPS=ON ${{ matrix.extra }}
      - name: Build
        run: cmake --build out --config Release --parallel
      - name: Package
        shell: bash
        run: |
          mkdir -p pkg/hg2-port
          cmake --install out --config Release --prefix pkg/hg2-port
          cp -r docs pkg/hg2-port/
          cd pkg
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../hg2-port-${{ matrix.name }}.zip hg2-port; else zip -qr ../hg2-port-${{ matrix.name }}.zip hg2-port; fi
      - uses: actions/upload-artifact@v4
        with:
          name: hg2-port-${{ matrix.name }}
          path: hg2-port-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
